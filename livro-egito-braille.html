<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Egito Antigo — livro ilustrado com Braille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lapis:#143A6B;
    --lapis-fundo:#0E2A50;
    --faianca:#2FA79E;
    --ouro:#E9B33C;
    --ocre:#B8502C;
    --papiro:#F5E7C8;
    --areia:#E0C48C;
    --tinta:#221F1A;
    --fonte:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:var(--papiro);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(233,179,60,.18), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(47,167,158,.16), transparent 50%);
    color:var(--tinta);
    font-family:var(--fonte);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px 40px;
  }

  h1{
    font-size:1.1rem;
    font-weight:500;
    letter-spacing:.02em;
    color:var(--lapis);
    margin:0 0 18px;
    text-align:center;
  }

  .livro{
    width:100%;
    max-width:720px;
    background:#fff;
    border:4px solid var(--lapis);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 18px 0 -6px rgba(20,58,107,.18);
  }

  .cena{
    display:block;
    width:100%;
    height:auto;
    background:var(--lapis-fundo);
  }

  .cena[hidden]{display:none}

  .texto{
    margin:0;
    padding:26px 28px 8px;
    font-size:2rem;
    line-height:1.3;
    font-weight:700;
    color:var(--lapis);
    text-align:center;
  }

  .faixa-braille{
    background:var(--lapis);
    padding:20px 16px 22px;
    display:flex;
    justify-content:center;
  }

  .faixa-braille svg{
    width:100%;
    max-width:560px;
    height:auto;
  }

  .controles{
    width:100%;
    max-width:720px;
    margin-top:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }

  button{
    font-family:var(--fonte);
    font-size:1.05rem;
    font-weight:700;
    color:var(--lapis);
    background:var(--ouro);
    border:3px solid var(--lapis);
    border-radius:14px;
    padding:12px 20px;
    cursor:pointer;
    min-height:52px;
  }

  button:hover{background:#f3c25c}

  button:focus-visible{
    outline:4px solid var(--ocre);
    outline-offset:3px;
  }

  button[disabled]{
    opacity:.4;
    cursor:default;
  }

  .contador{
    font-size:1rem;
    font-weight:500;
    color:var(--lapis);
  }

  .nota{
    max-width:720px;
    margin-top:26px;
    font-size:.95rem;
    line-height:1.6;
    font-weight:500;
    color:#4a4335;
    text-align:center;
  }

  @media (max-width:520px){
    .texto{font-size:1.5rem;padding:20px 18px 6px}
    .controles{justify-content:center}
  }

  @media (prefers-reduced-motion:no-preference){
    .livro{transition:box-shadow .2s ease}
  }
</style>
</head>

const cenas     = document.querySelectorAll(".cena");
const elTexto   = document.getElementById("texto");
const elBraille = document.getElementById("braille");
const elContador= document.getElementById("contador");
const btAnterior= document.getElementById("anterior");
const btProxima = document.getElementById("proxima");
const btOuvir   = document.getElementById("ouvir");

let atual = 0;

/* Desenha uma linha de Braille.
   Cada célula tem 6 pontos. No Unicode, o ponto 1 é o bit 1,
   o ponto 2 é o bit 2, o ponto 3 o bit 4, e assim por diante. */
function desenharBraille(linha){
  const LARGURA_CELULA = 26;
  const COLUNA = 10;
  const LINHA = 10;
  const RAIO = 3.8;
  const MARGEM = 6;

  const posicoes = {
    1:[0,0], 2:[0,1], 3:[0,2],
    4:[1,0], 5:[1,1], 6:[1,2]
  };

  const celulas = [...linha];
  const largura = celulas.length * LARGURA_CELULA + MARGEM * 2;
  const altura  = LINHA * 2 + RAIO * 2 + MARGEM * 2;

  let formas = "";

  celulas.forEach((celula, indice) => {
    const codigo = celula.codePointAt(0) - 0x2800;
    if (codigo < 0) return; // espaço em branco entre palavras

    const baseX = MARGEM + indice * LARGURA_CELULA + RAIO;
    const baseY = MARGEM + RAIO;

    for (let ponto = 1; ponto <= 6; ponto++){
      if (codigo & (1 << (ponto - 1))){
        const [coluna, fileira] = posicoes[ponto];
        const cx = baseX + coluna * COLUNA;
        const cy = baseY + fileira * LINHA;
        formas += `<circle cx="${cx}" cy="${cy}" r="${RAIO}" fill="#E9B33C"/>`;
      }
    }
  });

  elBraille.setAttribute("viewBox", `0 0 ${largura} ${altura}`);
  elBraille.innerHTML = formas;
}

btAnterior.addEventListener("click", () => { if (atual > 0) mostrar(atual - 1); });
btProxima.addEventListener("click", () => { if (atual < paginas.length - 1) mostrar(atual + 1); });

document.addEventListener("keydown", (evento) => {
  if (evento.key === "ArrowRight" && atual < paginas.length - 1) mostrar(atual + 1);
  if (evento.key === "ArrowLeft"  && atual > 0) mostrar(atual - 1);
});

btOuvir.addEventListener("click", () => {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const fala = new SpeechSynthesisUtterance(paginas[atual].texto);
  fala.lang = "pt-BR";
  fala.rate = 0.9;
  window.speechSynthesis.speak(fala);
});

mostrar(0);
